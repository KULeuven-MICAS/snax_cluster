name: XDMA byte-mask regression
"on":
  push:
    branches: ["main"]
  pull_request:

jobs:
  byte-mask-e2e:
    name: C driver and wide-bank XDMA end-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MAKEFLAGS: "-j4 VK_PCH_I_FAST= VK_PCH_I_SLOW="
      JAVA_OPTS: "-Xms256m -Xmx4g -XX:ActiveProcessorCount=4"
      JVM_OPTS: "-Xms256m -Xmx4g -XX:ActiveProcessorCount=4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Check C-driver mask register writes
        run: python target/snitch_cluster/sw/snax/xdma/tests/test_byte_mask.py
      - name: Run C-driver to wide-bank SRAM regression
        run: |
          python target/snitch_cluster/sw/snax/xdma/tests/byte_mask_e2e/run.py
