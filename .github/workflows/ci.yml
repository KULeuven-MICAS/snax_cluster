    name: Run versacore dse configuration w/ Verilator (Generic LLVM)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Verilator's generated makefile runs its compiles through $(OBJCACHE).
      OBJCACHE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 1
      # Hash the compiler binary instead of its mtime: a fresh pixi install
      # gives the same compiler a new mtime.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 150M
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
      - uses: prefix-dev/setup-pixi@v0.8.1
