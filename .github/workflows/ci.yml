# Run functional regression checks
name: ci
on:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Caches are saved only by pushes to main; PR runs only read them.
  # TEMPORARY: the head_ref part lets the ry/ci-speed-2 PR save caches too, so
  # its own re-run shows hits. Remove it before merge.
  CACHE_WRITE: ${{ (github.event_name == 'push' && github.ref_name == 'main') ||
    github.head_ref == 'ry/ci-speed-2' }}
jobs:
  ########
  # Docs #
  ########

  docs:
    name: Build documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/pulp-platform/snitch_cluster:main
    steps:
      - uses: actions/checkout@v2
      - name: Build docs
        run: make docs

  ##############################################
  # Simulate SW on Snitch Cluster w/ Verilator #
  ##############################################

  sw-snitch-cluster-vlt:
    name: Simulate SW on Snitch Cluster w/ Verilator
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/pulp-platform/snitch_cluster@sha256:03c6b13b3c540d9f36722b183f694793293ca46558c13b8d55551ea7b01912bb
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
      - name: Install DNN Python Modules
        run: |
          pip3 install -r sw/dnn/requirements.txt
      - name: Build Software
        run: |
          bender vendor init
          make -C target/snitch_cluster sw \
          CFG_OVERRIDE=cfg/snitch_cluster.hjson \
          SELECT_RUNTIME=rtl \
          SELECT_TOOLCHAIN=llvm-snitch
      - name: Generate RTL
        run: |
          make -C target/snitch_cluster rtl-gen \
          CFG_OVERRIDE=cfg/snitch_cluster.hjson
      - name: Build Hardware
        run: |
          make -C target/snitch_cluster bin/snitch_cluster.vlt -j$(nproc) \
          CFG_OVERRIDE=cfg/snitch_cluster.hjson
      - name: Run Tests
        working-directory: target/snitch_cluster
        run: |
          ./run.py --simulator verilator \
          sw/runtime.yaml sw/snitch-cluster-runtime.yaml sw/custom-fp.yaml \
          sw/standard-fp.yaml sw/openmp.yaml sw/snitch-cluster-openmp.yaml \
          sw/blas.yaml sw/dnn.yaml -j

  ##############################################
  # Simulate SW on SNAX Cluster w/ Verilator #
  ##############################################

  snax-alu-cluster-vlt-generic:
    name: Simulate SW on SNAX ALU Cluster w/ Verilator (Generic LLVM)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Verilator's generated makefile runs its compiles through $(OBJCACHE).
      OBJCACHE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 1
      # Hash the compiler binary instead of its mtime: a fresh pixi install
      # gives the same compiler a new mtime.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 100M
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Restore sbt cache
        id: sbt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: sbt-rtlgen-${{ runner.os }}-${{ hashFiles('hw/**/build.sbt',
            'hw/**/project/build.properties',
            'hw/**/project/plugins.sbt') }}
          restore-keys: sbt-rtlgen-${{ runner.os }}-
      - name: Generate RTL
        run: |
          make -C target/snitch_cluster rtl-gen \
          CFG_OVERRIDE=cfg/snax_alu_cluster.hjson
      - name: Save sbt cache
        if: env.CACHE_WRITE == 'true' &&
          steps.sbt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: ${{ steps.sbt-cache.outputs.cache-primary-key }}
      - name: Build Software
        run: |
          make -C target/snitch_cluster sw \
          CFG_OVERRIDE=cfg/snax_alu_cluster.hjson
      # libfesvr only changes with FESVR_VERSION; the restored mtimes keep
      # make from downloading, configuring or rebuilding it.
      - name: Read FESVR_VERSION
        run: |
          echo "FESVR_VERSION=$(sed -n 's/^FESVR_VERSION *?= *//p' \
          target/common/common.mk)" >> "$GITHUB_ENV"
      - name: Restore libfesvr cache
        id: fesvr-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/snitch_cluster/work-vlt/riscv-isa-sim
            target/snitch_cluster/work-vlt/lib/libfesvr.a
          key: fesvr-${{ runner.os }}-${{ env.FESVR_VERSION }}
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-snax_alu_cluster-${{ github.sha }}
          restore-keys: ccache-snax_alu_cluster-
      - name: Build Hardware
        run: |
          ccache -z
          make CFG_OVERRIDE=cfg/snax_alu_cluster.hjson \
          -C target/snitch_cluster bin/snitch_cluster.vlt -j$(nproc)
          ccache -s
      - name: Save ccache
        if: env.CACHE_WRITE == 'true' &&
          steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Save libfesvr cache
        if: env.CACHE_WRITE == 'true' &&
          steps.fesvr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/snitch_cluster/work-vlt/riscv-isa-sim
            target/snitch_cluster/work-vlt/lib/libfesvr.a
          key: ${{ steps.fesvr-cache.outputs.cache-primary-key }}
      - name: Run Tests
        working-directory: target/snitch_cluster
        run: |-
          ./run.py --simulator verilator \
          sw/runtime.yaml \
          sw/snax-alu-run.yaml -j

