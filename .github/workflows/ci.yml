          make CFG_OVERRIDE=cfg/snax_compiler_test_cluster.hjson \
          -C target/snitch_cluster bin/snitch_cluster.vlt -j$(nproc)
          ccache -s
      - name: Save ccache
        if: env.CACHE_WRITE == 'true' &&
          steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Save libfesvr cache
        if: env.CACHE_WRITE == 'true' &&
          steps.fesvr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
