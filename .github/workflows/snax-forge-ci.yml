# Build the cluster of each snax-forge bundle kept as a fixture
# (cfg/snax_forge/<design>/: vecadd, vsum, vecadd_i32, vsum_tree_i8,
# vecmul_i32_i64, dot_1) with Verilator: its accelerator's RTL comes from
# generated/snax_forge.f, which snaxgen writes from the cfg's
# snax_forge_rtl. Then build the fixture's own program (sw/apps/snax-forge)
# and run it on that build (snax_forge.mk): the job passes on the program's
# exit code 0 and every counter line the fixture's README expects (dot_1's
# two groups print two).
name: snax-forge-ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  snax-forge-cluster-vlt:
    name: Build and run the snax-forge ${{ matrix.design }} bundle w/ Verilator
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Each fixture; its README lists the counter lines it expects
        design: [vecadd, vsum, vecadd_i32, vsum_tree_i8, vecmul_i32_i64, dot_1]
    defaults:
      run:
        shell: bash
    env:
      CFG: cfg/snax_forge/${{ matrix.design }}/snax_forge.hjson
      README: >-
        target/snitch_cluster/cfg/snax_forge/${{ matrix.design }}/README.md
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Generate RTL
        run: |
          make -C target/snitch_cluster rtl-gen CFG_OVERRIDE=$CFG
      - name: Check snax_forge.f
        working-directory: target/snitch_cluster
        run: |
          f=generated/snax_forge.f
          test -s "$f" || { echo "$f is missing or empty"; exit 1; }
          while read -r p; do
            test -f "$p" || { echo "$f lists a missing file: $p"; exit 1; }
          done < "$f"
          cat "$f"
      - name: Build Hardware
        run: |
          make CFG_OVERRIDE=$CFG -C target/snitch_cluster \
          bin/snitch_cluster.vlt -j$(nproc) 2>&1 | tee vlt-build.log
      # Verilator runs with -Wno-fatal: a duplicate module name would pass
      - name: Check for duplicate module names
        run: |
          if grep -n "%Warning-MODDUP" vlt-build.log; then
            echo "duplicate module names (see above)"; exit 1
          fi
      - name: Run the fixture's program
        run: |
          make -C target/snitch_cluster snax-forge-run SIM=vlt CFG_OVERRIDE=$CFG
      - name: Print the forge lines
        if: always()
        run: |
          grep '^forge' target/snitch_cluster/logs/snax-forge-vlt.txt
      # Every counter line the fixture's README expects, which SNAX-GVSoC
      # also gives (one per accelerator task)
      - name: Check the forge counters
        run: |
          log=target/snitch_cluster/logs/snax-forge-vlt.txt
          want=$(sed -n 's/^    \(forge counter .*\)$/\1/p' "$README")
          if [ -z "$want" ]; then
            echo "$README lists no forge counter line"; exit 1
          fi
          while read -r line; do
            if ! grep -qx "$line" "$log"; then
              echo "expected, not printed: $line"; exit 1
            fi
            echo "as expected: $line"
          done <<< "$want"
