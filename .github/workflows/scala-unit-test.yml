# Run Scala Unit Test
name: Run Scala Unit Test
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  run:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Initialize and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Generate RTL
        run: |
          make -C target/snitch_cluster rtl-gen \
          CFG_OVERRIDE=cfg/snax_alu_cluster.hjson
      # Verilator 5.034 (the version pixi.lock resolves) compiles the
      # precompiled header to <top>__pch.h.{fast,slow}.gch but tells the
      # compiler `-include <top>__pch.h.{fast,slow}` -- a file it never
      # creates. GCC only tolerates that while the .gch stays valid, and
      # chiseltest's extra -CFLAGS invalidate it, so the fallback to the
      # missing header aborts the build. This only bites designs Verilator
      # splits across several .cpp files (VM_PARALLEL_BUILDS=1), i.e. the
      # FP DataPathExtension harnesses. Blanking the two make variables
      # drops the bad -include and builds without PCH.
      - name: Run the unit tests
        working-directory: hw/chisel
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
        run: |
          sbt test
      - name: Run the acc unit tests
        working-directory: hw/chisel_acc
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
        run: |
          sbt test
