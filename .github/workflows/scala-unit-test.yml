# Run Scala Unit Test
name: Run Scala Unit Test
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Caches are saved only by pushes to main; PR runs only read them.
  CACHE_WRITE: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

jobs:
  # hw/chisel runs in shards (SNAX_TEST_SHARD in hw/chisel/build.sbt), one
  # runner each. The named shards each hold one or two long Verilator suites;
  # rest runs every other suite.
  chisel-shard:
    name: Test hw/chisel (${{ matrix.shard }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: stream-reduce
            vlt-build-jobs: 4
          - shard: xdma-app
            vlt-build-jobs: 4
          - shard: stream-map
            vlt-build-jobs: 4
          # rest runs many suites at once, so each Verilator build keeps 1 job.
          - shard: rest
            vlt-build-jobs: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Initialize and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Restore sbt cache
        id: sbt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: sbt-test-chisel-${{ runner.os }}-${{ hashFiles(
            'hw/**/build.sbt', 'hw/**/project/build.properties',
            'hw/**/project/plugins.sbt') }}
          restore-keys: sbt-test-chisel-${{ runner.os }}-
      # Verilator 5.034 (the version pixi.lock resolves) compiles the
      # precompiled header to <top>__pch.h.{fast,slow}.gch but tells the
      # compiler `-include <top>__pch.h.{fast,slow}` -- a file it never
      # creates. GCC only tolerates that while the .gch stays valid, and
      # chiseltest's extra -CFLAGS invalidate it, so the fallback to the
      # missing header aborts the build. This only bites designs Verilator
      # splits across several .cpp files (VM_PARALLEL_BUILDS=1), i.e. the
      # FP DataPathExtension harnesses. Blanking the two make variables
      # drops the bad -include and builds without PCH.
      - name: Run the unit tests
        working-directory: hw/chisel
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
          SNAX_TEST_SHARD: ${{ matrix.shard }}
          SNAX_VLT_BUILD_JOBS: ${{ matrix.vlt-build-jobs }}
        run: |
          sbt test
      # sbt's JUnit XML reports hold each suite's run time.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-chisel-${{ matrix.shard }}
          path: hw/chisel/target/test-reports/
      # All shards share one sbt cache; only rest saves it.
      - name: Save sbt cache
        if: env.CACHE_WRITE == 'true' && matrix.shard == 'rest' &&
          steps.sbt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: ${{ steps.sbt-cache.outputs.cache-primary-key }}

  # The status check for hw/chisel: passes only if every shard passed.
  chisel:
    name: Test hw/chisel
    needs: chisel-shard
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the shard results
        env:
          RESULT: ${{ needs.chisel-shard.result }}
        run: |
          echo "hw/chisel shards: $RESULT"
          test "$RESULT" = success

  chisel-acc:
    name: Test hw/chisel_acc
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Initialize and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Restore sbt cache
        id: sbt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: sbt-test-acc-${{ runner.os }}-${{ hashFiles(
            'hw/**/build.sbt', 'hw/**/project/build.properties',
            'hw/**/project/plugins.sbt') }}
          restore-keys: sbt-test-acc-${{ runner.os }}-
      # The MAKEFLAGS PCH workaround is explained in the chisel job.
      - name: Run the unit tests
        working-directory: hw/chisel_acc
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
        run: |
          sbt test
      # sbt's JUnit XML reports hold each suite's run time.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-chisel-acc
          path: hw/chisel_acc/target/test-reports/
      - name: Save sbt cache
        if: env.CACHE_WRITE == 'true' &&
          steps.sbt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: ${{ steps.sbt-cache.outputs.cache-primary-key }}
