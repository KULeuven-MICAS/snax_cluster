# Run Scala Unit Test
name: Run Scala Unit Test
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Caches are saved only by pushes to main; PR runs only read them.
  # TEMPORARY: the head_ref part lets the ry/ci-speed-2 PR save caches too, so
  # its own re-run shows hits. Remove it before merge.
  CACHE_WRITE: ${{ (github.event_name == 'push' && github.ref_name == 'main') ||
    github.head_ref == 'ry/ci-speed-2' }}

jobs:
  run:
    name: Build and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Initialize and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Restore sbt cache
        id: sbt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: sbt-test-${{ runner.os }}-${{ hashFiles('hw/**/build.sbt',
            'hw/**/project/build.properties',
            'hw/**/project/plugins.sbt') }}
          restore-keys: sbt-test-${{ runner.os }}-
      - name: Generate RTL
        run: |
          make -C target/snitch_cluster rtl-gen \
          CFG_OVERRIDE=cfg/snax_alu_cluster.hjson
      # Verilator 5.034 (the version pixi.lock resolves) compiles the
      # precompiled header to <top>__pch.h.{fast,slow}.gch but tells the
      # compiler `-include <top>__pch.h.{fast,slow}` -- a file it never
      # creates. GCC only tolerates that while the .gch stays valid, and
      # chiseltest's extra -CFLAGS invalidate it, so the fallback to the
      # missing header aborts the build. This only bites designs Verilator
      # splits across several .cpp files (VM_PARALLEL_BUILDS=1), i.e. the
      # FP DataPathExtension harnesses. Blanking the two make variables
      # drops the bad -include and builds without PCH.
      - name: Run the unit tests
        working-directory: hw/chisel
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
        run: |
          sbt test
      - name: Run the acc unit tests
        working-directory: hw/chisel_acc
        env:
          MAKEFLAGS: "VK_PCH_I_FAST= VK_PCH_I_SLOW="
        run: |
          sbt test
      - name: Save sbt cache
        if: env.CACHE_WRITE == 'true' &&
          steps.sbt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/llvm-firtool
            ~/.sbt
          key: ${{ steps.sbt-cache.outputs.cache-primary-key }}
